<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход и регистрация</title>
<style>
/* ---------------- ОБЩИЕ ---------------- */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
body{
background:black;
color:white;
overflow:hidden;
}
/* ---------------- ОСНОВНОЙ САЙТ ---------------- */
.main-site{
position:fixed;
top:0;
left:0;
width:100%;
height:100vh;
background:linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963d?q=80&w=2070');
background-size:cover;
background-position:center;
z-index:1;
}
/* ---------------- ТЕМНОЕ ЗАТЕМНЕНИЕ ---------------- */
.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.45);
display:flex;
justify-content:center;
align-items:center;
z-index:100;
backdrop-filter:blur(3px);
}
/* ---------------- МОДАЛКА ---------------- */
.modal{
width:700px;
background:#2b252d;
border-radius:15px;
padding:45px;
position:relative;
}
/* ---------------- ВЕРХ ---------------- */
.top{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:50px;
font-size:28px;
}
.top button{
background:none;
border:none;
color:#777;
font-size:28px;
cursor:pointer;
}
.top button.active{
color:white;
}
/* ---------------- ФОРМЫ ---------------- */
.form{
display:none;
}
.form.active{
display:block;
}
/* ---------------- ПОЛЯ ---------------- */
.field{
margin-bottom:25px;
position:relative;
}
.field input{
width:100%;
height:65px;
background:#05030a;
border:2px solid #555;
border-radius:40px;
padding:0 25px;
color:white;
font-size:18px;
outline:none;
transition:0.3s;
}
.field input::placeholder{
color:#777;
}
.field input:focus{
border:2px solid #999;
}
.field input.error{
border:2px solid #ff004c;
box-shadow:0 0 10px rgba(255,0,76,0.5), 0 0 25px rgba(255,0,76,0.3);
}
/* ---------------- КНОПКА ---------------- */
.submit-btn{
width:fit-content;
min-width:180px;
height:65px;
padding:0 40px;
margin:30px auto 0;
display:block;
border:2px solid #E2E2E2;
border-radius:20px;
background:linear-gradient(90deg, #000000 0%, #8b8b8b 85%, #c4c4c4 100%);
color:#E2E2E2;
font-size:24px;
cursor:pointer;
transition:0.5s;
}
.submit-btn:hover{
background:#FFFFFF;
color:black;
box-shadow:0 0 20px #E2E2E2, 0 0 50px #7a7a7a;
}
</style>
</head>
<body>
<div class="main-site"></div>
<div class="overlay">
<div class="modal">
<div class="top">
<button id="loginTab" class="active">Вход</button>
<span>/</span>
<button id="registerTab">Регистрация</button>
</div>

<!-- ВХОД -->
<form id="loginForm" class="form active">
<div class="field"><input type="text" placeholder="Логин" id="loginName"></div>
<div class="field"><input type="password" placeholder="Пароль" id="loginPassword"></div>
<button type="submit" class="submit-btn">Войти</button>
</form>

<!-- РЕГИСТРАЦИЯ -->
<form id="registerForm" class="form">
<div class="field"><input type="text" placeholder="Логин" id="registerName"></div>
<div class="field"><input type="password" placeholder="Пароль" id="registerPassword"></div>
<div class="field"><input type="password" placeholder="Повторите пароль" id="repeatPassword"></div>
<button type="submit" class="submit-btn">Зарегистрироваться</button>
</form>
</div>
</div>

<script>
// Переключение вкладок
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

loginTab.addEventListener('click', () => {
    loginForm.classList.add('active');
    registerForm.classList.remove('active');
    loginTab.classList.add('active');
    registerTab.classList.remove('active');
});
registerTab.addEventListener('click', () => {
    registerForm.classList.add('active');
    loginForm.classList.remove('active');
    registerTab.classList.add('active');
    loginTab.classList.remove('active');
});

// Вход
loginForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const inputs = loginForm.querySelectorAll('input');
    let hasError = false;
    inputs.forEach(input => {
        input.classList.remove('error');
        if(input.value.trim() === '') {
            input.classList.add('error');
            hasError = true;
        }
    });
    if(hasError) return;
    // Сохраняем статус входа в localStorage
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('username', document.getElementById('loginName').value);
    alert('Успешный вход');
    window.location.href = 'index.html';   // ПЕРЕХОД НА ГЛАВНУЮ
});

// Регистрация
registerForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const inputs = registerForm.querySelectorAll('input');
    let hasError = false;
    inputs.forEach(input => {
        input.classList.remove('error');
        if(input.value.trim() === '') {
            input.classList.add('error');
            hasError = true;
        }
    });
    const pwd = document.getElementById('registerPassword').value;
    const repeat = document.getElementById('repeatPassword').value;
    if(pwd !== repeat) {
        document.getElementById('repeatPassword').classList.add('error');
        alert('Пароли не совпадают');
        return;
    }
    if(hasError) return;
    localStorage.setItem('isLoggedIn', 'true');
    localStorage.setItem('username', document.getElementById('registerName').value);
    alert('Успешная регистрация');
    window.location.href = 'index.html';   // ПЕРЕХОД НА ГЛАВНУЮ
});

// Убираем ошибку при вводе
document.querySelectorAll('input').forEach(input => {
    input.addEventListener('input', () => input.classList.remove('error'));
});
</script>
</body>
</html>
